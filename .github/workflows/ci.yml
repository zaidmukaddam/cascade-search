name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: lint and format
        run: pnpm lint && uvx ruff check training && uvx ruff format --check training
      - name: types
        run: pnpm typecheck
      - name: tests
        run: pnpm test
        env: { SKIP_GPU: 1 }
      - name: bundle-size gate
        run: pnpm --filter cascade-search build && pnpm size
      - name: website build
        run: pnpm --filter cascade-search-website build

  wgsl-parity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: TS/WGSL parity on Metal
        run: pnpm vitest run packages/core/test/parity.test.ts || pnpm vitest run packages/core/test/parity.test.ts
        env: { REQUIRE_GPU: 1 }
